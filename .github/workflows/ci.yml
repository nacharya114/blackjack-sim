name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---- Test the engine across supported Python versions -------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Build native engine (Cython)
        run: python setup.py build_ext --inplace
      - name: Run tests
        run: pytest

  # ---- Build the dashboard and publish it as a CI artifact ----------------
  build-dashboard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build dashboard + PNG charts from tracked results
        run: python visualize.py --data results/sweep.json
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            results/dashboard.html
            results/*.png
      - name: Package site for Pages
        run: |
          mkdir -p _site
          cp results/dashboard.html _site/index.html
          cp results/*.png _site/ 2>/dev/null || true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ---- Deploy the dashboard to GitHub Pages (main only) -------------------
  # Requires Pages enabled for the repo: Settings -> Pages -> Source: GitHub Actions.
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-dashboard
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
